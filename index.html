<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Roça · Rebanho e leite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F7; --surface:#FFFFFF; --ink:#1F2A1E; --ink2:#4D5B67; --ink3:#87939D;
  --line:#E2E7EB; --line2:#CFD7DD; --acc:#2F6B3A; --acc2:#3A7F47; --accbg:#E6F1E7;
  --jade:#0E7A66; --jadebg:#E3F3EF; --wine:#B23A48; --winebg:#F9E6E8; --amber:#9A6412; --amberbg:#FBF0DC;
  --r-s:6px; --r-m:10px; --r-l:16px; --side:248px;
  --money:"Fraunces", Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.money{font-family:var(--money);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.pos{color:var(--jade)} .neg{color:var(--wine)} .muted{color:var(--ink3)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.015em}

/* ---------- Login ---------- */
#login{min-height:100vh;display:none;grid-template-columns:1fr 1fr}
#login .art{background:var(--ink);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
#login .art .marca{font-family:var(--money);font-size:44px;line-height:1.05}
#login .art .marca small{display:block;font-family:"Manrope";font-size:15px;opacity:.7;margin-top:10px;letter-spacing:0}
#login .art p{max-width:34ch;opacity:.75;margin:0}
#login form{align-self:center;justify-self:center;width:100%;max-width:360px;padding:32px 24px}
#login h1{font-size:24px;margin-bottom:6px}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-m);padding:11px 12px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
textarea.inp{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.msg{font-size:13px;margin-top:12px;min-height:20px}
.msg.err{color:var(--wine)} .msg.ok{color:var(--jade)}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-m);padding:10px 16px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--acc2)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.sec:hover{background:var(--paper)}
.btn.ghost{background:transparent;color:var(--acc);padding:8px 10px}
.btn.ghost:hover{background:var(--accbg)}
.btn.danger{background:var(--surface);color:var(--wine);border-color:var(--line2)}
.btn.danger:hover{background:var(--winebg)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:var(--r-s)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--acc);font-weight:600;cursor:pointer;padding:0}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--ink3);padding:6px;border-radius:var(--r-s);display:inline-flex}
.icon-btn:hover{background:var(--paper);color:var(--ink)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- Estrutura ---------- */
#app{display:none}
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:24px 14px 18px;z-index:20;overflow-y:auto}
#side .marca{font-family:var(--money);font-size:24px;line-height:1.1;padding:0 10px}
#side .marca small{display:block;font-family:"Manrope";font-size:12px;opacity:.6;margin-top:4px}
#side nav{margin-top:28px;display:flex;flex-direction:column;gap:2px}
#side nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:rgba(255,255,255,.72);padding:10px 12px;border-radius:var(--r-m);cursor:pointer;font-weight:600}
#side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
#side nav button.on{background:#fff;color:var(--ink)}
#side nav .grp{font-size:12px;opacity:.45;padding:18px 12px 6px}
#side .conta{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;opacity:.85;word-break:break-all}
#side .conta button{background:none;border:0;color:#fff;opacity:.7;cursor:pointer;padding:0;margin-top:4px;text-decoration:underline}
main{margin-left:var(--side);padding:32px 40px 80px;max-width:calc(1180px + var(--side))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head h1{font-size:26px}
.head p{margin:4px 0 0;color:var(--ink2);max-width:62ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .inp{width:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:16px;margin-bottom:4px}
.panel .sub{color:var(--ink3);font-size:13px;margin:0 0 14px}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>*{min-width:0}

.faixa{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);margin-bottom:16px}
.faixa>div{padding:18px 20px}
.faixa>div+div{border-left:1px solid var(--line)}
.faixa .l{font-size:13px;color:var(--ink2);font-weight:600}
.faixa .v{font-size:28px;margin-top:4px}
.faixa .s{font-size:12px;color:var(--ink3)}

/* Tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tfoot td{border-top:2px solid var(--line2);font-weight:700}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
.nc{display:none} .mob{display:none} .tag.nc{display:none}
.pessoa{display:flex;align-items:center;gap:10px;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;color:#fff}
.placa{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.04em;border:1.5px solid var(--ink);border-radius:5px;padding:0 6px;background:#fff;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:var(--jadebg);color:var(--jade)} .t-bad{background:var(--winebg);color:var(--wine)} .t-warn{background:var(--amberbg);color:var(--amber)} .t-mut{background:var(--paper);color:var(--ink3)} .t-acc{background:var(--accbg);color:var(--acc)}
.vazio{padding:28px 10px;text-align:center;color:var(--ink3)}
.vazio .btn{margin-top:12px}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:var(--amberbg);color:#5d3d09;margin-bottom:16px}
.aviso.ok{background:var(--jadebg);color:#0b4f42}
.aviso.info{background:var(--accbg);color:#123c52}
.aviso b{display:block}

/* ---------- Calendário ---------- */
.mesnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:4px}
.mesnav .lbl{padding:0 10px;font-weight:700;min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;font-weight:700;color:var(--ink3);text-align:center;padding:4px 0}
.cal .d{min-height:92px;border-radius:var(--r-s);background:var(--paper);padding:6px;font-size:13px;position:relative;cursor:pointer;border:1px solid transparent;text-align:left;display:flex;flex-direction:column}
.cal .d:hover{border-color:var(--line2)}
.cal .d.fora{opacity:.35;cursor:default}
.cal .d.hoje{outline:2px solid var(--acc)}
.cal .d .n{font-weight:700;display:flex;justify-content:space-between}
.cal .d .n .q{font-size:11px;color:var(--acc)}
.cal .d .chips{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.cal .d .chip{font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d .chip.x{outline:2px solid var(--amber);outline-offset:-2px}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:12px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- Holerite ---------- */
.holerite{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);margin-bottom:12px;overflow:hidden}
.holerite .topo{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.holerite .topo .nome{flex:1;min-width:0}
.holerite .topo .nome b{display:block}
.holerite .topo .liq{text-align:right}
.holerite .topo .liq .money{font-size:24px}
.holerite .corpo{display:none;border-top:1px solid var(--line);padding:18px;grid-template-columns:1.2fr 1fr;gap:28px}
.holerite.aberto .corpo{display:grid}
.ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.ln.tot{border-top:2px solid var(--ink);border-bottom:0;margin-top:6px;padding-top:10px;font-weight:700}
.ln.tot .money{font-size:20px}
.bloco-t{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 4px}
.bloco-t:first-child{margin-top:0}
.ajustes{background:var(--paper);border-radius:var(--r-m);padding:14px}

/* ---------- Importação ---------- */
.prev td{padding:4px 4px}
.prev .inp{padding:6px 7px;font-size:13px;border-radius:6px;min-width:0}
.prev tr.dup td{background:var(--amberbg)}
.prev tr.off td{opacity:.45}
.fotoprev{max-width:100%;max-height:260px;border-radius:var(--r-m);border:1px solid var(--line);display:block;margin-top:8px}
.fotogrande{width:100%;border-radius:var(--r-m)}
.anx{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-m);margin-top:6px;font-size:14px}
.anx .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.anx .muted{font-size:12px;white-space:nowrap}
.icon-btn small{font-size:11px;font-weight:700;margin-left:1px}
.benrow{display:grid;grid-template-columns:1fr 1fr 1.3fr 1.3fr 32px;gap:8px;align-items:end;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.benrow label:first-child{grid-column:1/-1}
.benrow .inp{min-width:0}
.benrow span{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.benrow .inp{padding:8px 9px;font-size:14px}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;background:rgba(23,36,47,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:48px 16px;overflow:auto}
#modal.on{display:flex}
#modal .box{background:var(--surface);border-radius:var(--r-l);width:100%;max-width:520px;padding:24px;box-shadow:0 20px 50px rgba(23,36,47,.25)}
#modal h2{font-size:19px}
#modal .desc{color:var(--ink2);margin:6px 0 4px}
#modal .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.fg .full,.fg3 .full{grid-column:1/-1}
.ajuda{font-size:12px;color:var(--ink3);margin-top:4px}
.toggle{display:flex;gap:10px;align-items:center;margin-top:16px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--acc)}
.chk{width:18px;height:18px;accent-color:var(--amber);cursor:pointer}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(23,36,47,.12)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r-m);font-weight:600;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--wine)}
#carregando{position:fixed;inset:0;background:var(--paper);display:none;align-items:center;justify-content:center;z-index:90;flex-direction:column;gap:12px;color:var(--ink2)}
#carregando i{width:28px;height:28px;border:3px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#sync{font-size:12px;color:rgba(255,255,255,.55);margin-top:6px}

/* ---------- Celular ---------- */
#tabbar{display:none}
#offbar{display:none;position:sticky;top:0;z-index:40;margin-left:var(--side);padding:10px 16px;background:var(--amberbg);color:#5d3d09;font-size:14px;font-weight:600;line-height:1.4;border-bottom:1px solid #ecd9b0}
#offbar.on{display:block}
#offbar.env{background:var(--accbg);color:#123c52;border-color:#cfe3d2}
#mais{display:none}
@media (max-width:900px){
  #side{display:none}
  main{margin-left:0;padding:20px 16px 110px}
  #offbar{margin-left:0;padding-top:calc(10px + env(safe-area-inset-top))}
  .head h1{font-size:22px}
  .faixa{grid-template-columns:1fr 1fr}
  .faixa>div:nth-child(3){border-left:0}
  .faixa>div:nth-child(n+3){border-top:1px solid var(--line)}
  .faixa .v{font-size:22px}
  .grid2{grid-template-columns:1fr}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  #tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3);padding:6px 0;cursor:pointer}
  #tabbar button.on{color:var(--acc)}
  #tabbar button.lancar{color:#fff}
  #tabbar button.lancar span.bolha{background:var(--acc);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 12px rgba(47,107,58,.35)}
  #tabbar button.lancar span.t{color:var(--acc)}
  #mais.on{display:block;position:fixed;inset:0;background:rgba(23,36,47,.4);z-index:40}
  #mais .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
  #mais .sheet button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:14px 12px;font-weight:600;text-align:left;border-radius:var(--r-m);cursor:pointer}
  #mais .sheet button:hover{background:var(--paper)}
  .mesnav .lbl{min-width:0;font-size:14px}
  .holerite .corpo{grid-template-columns:1fr}
  .holerite .topo .liq .money{font-size:20px}
  .cal{gap:2px}
  .cal .d{min-height:54px;padding:4px}
  .cal .d .chips{flex-direction:row;flex-wrap:wrap;gap:2px}
  .cal .d .chip{font-size:0;width:8px;height:8px;padding:0;border-radius:50%}
  #login{grid-template-columns:1fr}
  #login .art{padding:32px 24px;min-height:auto}
  #login .art .marca{font-size:32px}
  #login .art p{display:none}
  .fg,.fg3{grid-template-columns:1fr 1fr}
  td.hide-m,th.hide-m,.hide-m{display:none}
  td.act .icon-btn{padding:4px}
  .nf{display:none} .nc{display:inline} td.nc{display:table-cell} .mob{display:block} .tag.nc{display:inline-block}
  #modal{padding:16px 8px}
  .benrow{grid-template-columns:1fr 1fr}
  .benrow .icon-btn{grid-column:1/-1;justify-self:end}
  #modal .box{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{#side,#tabbar,#offbar,.tools,.btn{display:none!important}main{margin:0;padding:0}}
.brinco{display:inline-block;font-size:11px;font-weight:700;background:#F4D35E;color:#3b3000;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:middle;letter-spacing:.03em}
.brinco.grande{font-size:15px;padding:1px 8px}
.fotoanimal{max-width:100%;max-height:320px;border-radius:var(--r-m);display:block;margin:auto}
.chips-sel{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto;padding:2px}
.chip-sel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:20px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface)}
.chip-sel.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.chip-sel input{display:none}
.chip-sel small{color:var(--ink3);font-weight:600}
.ln .link{font-weight:600}
.aviso.perigo{background:var(--winebg);color:#6d1d27}

</style>
</head>
<body>

<div id="carregando"><i></i><span id="carregandoMsg">Carregando dados…</span></div>

<!-- ======================= LOGIN ======================= -->
<section id="login">
  <div class="art">
    <div class="marca">Roça<small>Rebanho e leite</small></div>
    <p>Vacas, partos, inseminações, remédios, controle leiteiro, folha do leite e caixa em um só lugar. Funciona no celular, direto no curral.</p>
  </div>
  <form onsubmit="event.preventDefault();entrar()">
    <h1>Entrar</h1>
    <div class="muted">Use o e-mail e a senha da sua conta.</div>
    <label class="field"><span>E-mail</span><input class="inp" id="lgEmail" type="email" autocomplete="username" required></label>
    <label class="field"><span>Senha</span><input class="inp" id="lgSenha" type="password" autocomplete="current-password" required></label>
    <button class="btn block" style="margin-top:20px" id="lgBtn">Entrar</button>
    <div class="msg" id="lgMsg"></div>
    <button type="button" class="link" onclick="esqueciSenha()">Esqueci a senha</button>
  </form>
</section>

<!-- ======================= APP ======================= -->
<div id="app">
  <aside id="side">
    <div class="marca">Roça<small>Rebanho e leite</small></div>
    <nav id="nav"></nav>
    <div class="conta"><div id="contaEmail"></div><div id="sync">Tudo salvo</div><button onclick="sair()">Sair</button></div>
  </aside>
  <div id="offbar" role="status"></div>
  <main id="main"></main>
  <nav id="tabbar"></nav>
  <div id="mais" onclick="if(event.target.id==='mais')fecharMais()"><div class="sheet" id="maisSheet"></div></div>
</div>

<div id="modal" onclick="if(event.target.id==='modal')fecharModal()"><div class="box" id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =====================================================================

const somaMes = (ym,n) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };

const difDias = (a,b) => Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/86400000);

const dec1 = v => (Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:1});

function tempo(o){
  if(!o) return 0; if(o.criado) return o.criado;
  const ref=o.tratId||o.id||''; const t=parseInt(String(ref).slice(0,8),36);
  return t>1.6e12&&t<2.2e12 ? t : 0;
}

function num(v){
  if (typeof v==='number') return v;
  v=String(v??'').trim().replace(/[R$\s]/g,'');
  if (!v) return 0;
  if (v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(v)) v=v.replace(/\./g,'');
  const n=parseFloat(v); return isNaN(n)?0:Math.round(n*10000)/10000;
}

}

/* ============================ REPRODUÇÃO ============================
   Para cada fêmea: último parto → serviços (inseminação/cobertura) depois dele
   → último diagnóstico depois do último serviço.
   Previsão do parto = data do último serviço + gestação (padrão 283 dias),
   ou a data prevista informada no diagnóstico. Secar = previsão − 60 dias.
   =================================================================== */
const evDe = id => eventos.filter(e=>e.animalId===id).sort((a,b)=>a.data.localeCompare(b.data)||tempo(a)-tempo(b));
function statusRepro(a){
  const c=cfg(), evs=evDe(a.id);
  const partos=evs.filter(e=>e.tipo==='parto'), ultParto=partos[partos.length-1];
  const desde=ultParto?ultParto.data:'';
  const serv=evs.filter(e=>(e.tipo==='ia'||e.tipo==='cobertura')&&e.data>=desde&&(!ultParto||e.data>ultParto.data||tempo(e)>tempo(ultParto)));
  const ultServ=serv[serv.length-1];
  const diag=ultServ?evs.filter(e=>e.tipo==='diagnostico'&&e.data>=ultServ.data).pop():null;
  const secagem=ultParto?evs.filter(e=>e.tipo==='secagem'&&e.data>=ultParto.data).pop():evs.filter(e=>e.tipo==='secagem').pop();
  const r={ultParto, ultServ, servicos:serv.length, diag, secagem, partos:partos.length};
  if(!ultServ){ r.status=ultParto?'parida':'sem'; r.diasParida=ultParto?difDias(hoje(),ultParto.data):null; return r; }
  if(diag&&diag.resultado==='vazia'){ r.status='vazia'; return r; }
  r.status=diag?'prenha':'inseminada';
  r.previsao=(diag&&diag.previsao)||somaDias(ultServ.data,c.gestacao);
  r.secar=somaDias(r.previsao,-c.secagem);
  r.diasServ=difDias(hoje(),ultServ.data);
  r.pai=ultServ.paiId?nomeAnimal(ultServ.paiId):(ultServ.paiNome||'');
  r.tipoServ=ultServ.tipo;
  return r;
}
const STATUS_TXT = {sem:'Sem inseminação', parida:'Parida (sem inseminação)', vazia:'Vazia', inseminada:'Inseminada · aguardando diagnóstico', prenha:'Prenha'};
const STATUS_TAG = {sem:'t-mut', parida:'t-acc', vazia:'t-bad', inseminada:'t-warn', prenha:'t-ok'};

/* ---------- carência de leite ---------- */
function carenciasAtivas(dataRef){
  const d=dataRef||hoje(), out=[];
  tratamentos.forEach(t=>{ const n=int(t.carencia); if(!n) return; const fim=somaDias(t.data,n); if(fim>=d && t.data<=d) (t.vacas||[]).forEach(v=>out.push({animalId:v, fim, produto:t.produto, tratId:t.id})); });
  const porVaca={}; out.forEach(c=>{ if(!porVaca[c.animalId]||porVaca[c.animalId].fim<c.fim) porVaca[c.animalId]=c; });
  return Object.values(porVaca).sort((a,b)=>a.fim.localeCompare(b.fim));
}

/* ============================ FOLHA DO LEITE ============================
   recebido do laticínio = valor bruto − descontos da folha (ração, adiantamento…)
   repasse de cada parceiro = litros do parceiro × preço que vocês decidiram
   líquido do pai = valor bruto − descontos − repasses
   ======================================================================= */
function calcFolha(ref){
  const f=cad.folhas[ref]; if(!f) return null;
  const litros=num(f.litros), preco=num(f.preco), bruto=num(f.bruto)||r2(litros*preco);
  const parceiros=(f.parceiros||[]).map(x=>({...x, litros:num(x.litros), preco:num(x.preco), valor:r2(num(x.litros)*num(x.preco))}));
  const descontos=(f.descontos||[]).map(d=>({...d, valor:num(d.valor)}));
  const totDesc=r2(soma(descontos,d=>d.valor)), totRep=r2(soma(parceiros,x=>x.valor)), litrosParc=soma(parceiros,x=>x.litros);
  return {ref, ...f, litros, preco, bruto, parceiros, descontos, totDesc, totRep, litrosParc, litrosPai:r2(litros-litrosParc),
    recebido:r2(bruto-totDesc), liquidoPai:r2(bruto-totDesc-totRep), precoMedio:litros?bruto/litros:0};
}

/* ============================ DADOS ============================ */
function normalizar(s){
  s=s||{};
  s.parceiros=s.parceiros||[]; s.semens=s.semens||[]; s.folhas=s.folhas||{}; s.config=s.config||{};
  s.caixa=s.caixa||{}; s.caixa.saldos=s.caixa.saldos||{}; s.caixa.lancs=s.caixa.lancs||[];
  return s;
}
function statusSync(t){ const el=$('sync'); if(el) el.textContent=t; }
function lerBackup(){ try{ return JSON.parse(localStorage.getItem(BACKUP_LOCAL)||'null'); }catch(e){ return null; } }
function guardarLocal(){ try{ localStorage.setItem(BACKUP_LOCAL, JSON.stringify({cad, animais, eventos, tratamentos, pesagens})); }catch(e){} }
function salvar(){
  guardarLocal(); pendente=true; statusSync('Salvando…');
  clearTimeout(salvando);
  salvando=setTimeout(enviarCad,400);
}
function enviarCad(){
  clearTimeout(salvando); salvando=null;
  if(!pendente || !cadRef) return;
  pendente=false; acompanhar(()=>cadRef.set(JSON.parse(JSON.stringify(cad))));
}

/* ============================ SEM INTERNET ============================
   O Firestore guarda no próprio celular (IndexedDB) tudo o que é lançado
   e manda sozinho para a nuvem quando o sinal volta. Por isso as gravações
   NÃO esperam a resposta do servidor: sem sinal ela só chega depois.
   O sw.js guarda a página e as bibliotecas para o sistema abrir sem internet.
   ===================================================================== */
const PEND_LOCAL='roca_pend';
let fila=0, filaDesde=0, aguardando=false, ficouOffline=false, persistente=false, esperandoNuvem=false;
try{ aguardando=localStorage.getItem(PEND_LOCAL)==='1'; ficouOffline=aguardando; }catch(e){}
const online = () => navigator.onLine!==false;
function acompanhar(fazer){
  let p; try{ p=Promise.resolve(fazer()); }catch(e){ p=Promise.reject(e); }
  if(!fila) filaDesde=Date.now();
  fila++; marcarAguardando(); atualizarRede(); setTimeout(atualizarRede,6500);
  p.then(()=>{ fila--; atualizarRede(); }, e=>{ fila--; console.error(e); erroSalvar(e); atualizarRede(); });
  return p;
}
function marcarAguardando(){
  aguardando=true; try{ localStorage.setItem(PEND_LOCAL,'1'); }catch(e){}
  if(esperandoNuvem || !db || !db.waitForPendingWrites) return;
  esperandoNuvem=true;
  db.waitForPendingWrites().then(()=>{
    esperandoNuvem=false;
    if(fila>0){ marcarAguardando(); return; }
    aguardando=false; try{ localStorage.removeItem(PEND_LOCAL); }catch(e){}
    if(ficouOffline){ ficouOffline=false; toast('Sinal voltou: tudo foi enviado para a nuvem.'); }
    atualizarRede();
  }, e=>{ esperandoNuvem=false; console.warn(e); });
}
function atualizarRede(){
  const off=!online(); if(off) ficouOffline=true;
  const lento=fila>0 && Date.now()-filaDesde>6000;
  let txt='', cls='';
  if(off){ txt='Sem internet. Pode lançar normalmente: fica guardado no celular e vai para a nuvem quando o sinal voltar.'; cls='on'; }
  else if(aguardando && (ficouOffline||lento)){ txt=ficouOffline?'Sinal voltou. Enviando o que foi lançado sem internet…':'Sinal fraco. O que você lançou está guardado no celular e vai ser enviado assim que der.'; cls='on env'; }
  const b=$('offbar'); if(b){ b.textContent=txt; b.className=cls; }
  statusSync(off?'Sem internet · guardado no celular':(aguardando||pendente)?'Salvando…':'Tudo salvo');
}
window.addEventListener('online',atualizarRede);
window.addEventListener('offline',atualizarRede);
/* celular pode fechar a aba a qualquer hora: manda logo o que está esperando os 400 ms */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') enviarCad(); });
window.addEventListener('pagehide',enviarCad);
function erroSalvar(e){ toast(e&&e.code==='permission-denied' ? 'Sem permissão para salvar. Saia e entre de novo.' : 'Não foi possível salvar. Verifique a internet.', true); }
async function gravar(colecao, obj){
  const o=JSON.parse(JSON.stringify(obj)); const id=o.id||uid(); delete o.id;
  acompanhar(()=>db.collection(colecao).doc(id).set(o));
  return id;
}
async function apagarDoc(colecao, id){
  acompanhar(()=>db.collection(colecao).doc(id).delete());
}
function escutar(){
  $('carregando').style.display='flex';
  const chegou={}, FONTES=5;
  const pronto=fonte=>{
    if(Object.keys(chegou).length===FONTES){ redesenhar(); return; }
    chegou[fonte]=1;
    if(Object.keys(chegou).length===FONTES){ $('carregando').style.display='none'; render(); }
  };
  const erro=err=>{ console.error(err); $('carregando').style.display='none';
    toast(err.code==='permission-denied'?'Esta conta não tem acesso aos dados.':'Erro ao carregar os dados.', true); };
  const copia=lerBackup(), doCelular=snap=>snap.metadata&&snap.metadata.fromCache;
  unsubs.push(cadRef.onSnapshot(snap=>{
    if(chegou.cad && (pendente || snap.metadata.hasPendingWrites)) return;
    let d=snap.exists?snap.data():null;
    if(!d && doCelular(snap) && copia && copia.cad) d=copia.cad;  // sem sinal e sem cache: usa a cópia do celular
    cad=normalizar(d||{});
    guardarLocal(); pronto('cad');
  }, erro));
  const col=(nome,set)=>db.collection(nome).onSnapshot(snap=>{
    let l=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!l.length && doCelular(snap) && copia && (copia[nome]||[]).length) l=copia[nome];
    set(l); guardarLocal(); pronto(nome);
  }, erro);
  /* sem sinal o Firestore pode demorar para responder: depois de 6 s abre com a cópia do celular */
  setTimeout(()=>{
    if(Object.keys(chegou).length===FONTES) return;
    if(!copia || !copia.cad){ if(!online()) $('carregandoMsg').textContent='Sem internet e sem dados guardados neste celular. Abra o sistema uma vez com sinal.'; return; }
    if(!chegou.cad) cad=normalizar(copia.cad);
    if(!chegou.animais) animais=copia.animais||[];
    if(!chegou.eventos) eventos=copia.eventos||[];
    if(!chegou.tratamentos) tratamentos=copia.tratamentos||[];
    if(!chegou.pesagens) pesagens=copia.pesagens||[];
    ['cad','animais','eventos','tratamentos','pesagens'].forEach(f=>chegou[f]=1);
    $('carregando').style.display='none'; render(); atualizarRede();
  },6000);
  unsubs.push(col('animais', a=>animais=a));
  unsubs.push(col('eventos', a=>eventos=a));
  unsubs.push(col('tratamentos', a=>tratamentos=a));
  unsubs.push(col('pesagens', a=>pesagens=a));
}

let MODAL=null;
function abrirModal({titulo, desc='', corpo='', ok='Salvar', cancelar='Cancelar', perigo=false, aoConfirmar, larg, extra='', extraFim=''}){
  MODAL={aoConfirmar};
  $('mbox').style.maxWidth=larg||'520px';
  $('mbox').innerHTML=`<h2>${titulo}</h2>${desc?`<p class="desc">${desc}</p>`:''}<form id="mform" onsubmit="event.preventDefault();confirmarModal()">${corpo}<div class="acoes">${extra}${extraFim}${cancelar?`<button type="button" class="btn sec" onclick="fecharModal()">${cancelar}</button>`:''}${ok?`<button class="btn ${perigo?'danger':''}" id="mok">${ok}</button>`:''}</div></form>`;
  $('modal').classList.add('on');
  if($('anxLista')) desenharAnexos(); else ANX=null;
  setTimeout(()=>{ const f=$('mform')&&$('mform').querySelector('input:not([type=checkbox]):not([type=file]),select,textarea'); if(f && window.innerWidth>900 && !$('mbox').contains(document.activeElement)) f.focus(); },30);
}
async function confirmarModal(){ if(!MODAL) return; const b=$('mok'); if(b) b.disabled=true; let r; try{ r=await MODAL.aoConfirmar?.($('mform')); }catch(e){ r=false; } if(b) b.disabled=false; if(r===false) return; fecharModal(); }
function fecharModal(){ $('modal').classList.remove('on'); MODAL=null; render(); }
function confirmar(titulo, desc, ok, fn){ abrirModal({titulo, desc, ok, perigo:true, aoConfirmar:fn}); }

  ${car.length?alerta('perigo','Leite em carência — não mandar para o tanque', car.map(x=>`${esc(nomeAnimal(x.animalId))} até ${brCurto(x.fim)} (${esc(x.produto)})`).join(' · '))+'':''}
  ${prox90.filter(x=>x.s.previsao<=somaDias(h,15)).length?alerta('info','Parto chegando', prox90.filter(x=>x.s.previsao<=somaDias(h,15)).map(x=>`${esc(nomeAnimal(x.a.id))} por volta de ${brCurto(x.s.previsao)}`).join(' · ')):''}
  ${secar.length?alerta('info','Hora de secar', secar.map(x=>`${esc(nomeAnimal(x.a.id))} (secar ${brCurto(x.s.secar)})`).join(' · ')):''}
  ${semDiag.length?alerta('info','Fazer diagnóstico de prenhez', semDiag.map(x=>`${esc(nomeAnimal(x.a.id))} (inseminada há ${x.s.diasServ} dias)`).join(' · '),`<button class="link" onclick="formDiagnostico()">Lançar diagnóstico</button>`):''}
  <div class="faixa">
    <div style="cursor:pointer" onclick="ir('rebanho')"><div class="l">Vacas</div><div class="v money">${vacas.length}</div><div class="s">${lact.length} em lactação · ${at.length} animais no total</div></div>
    <div style="cursor:pointer" onclick="ir('reproducao')"><div class="l">Partos nos próximos 90 dias</div><div class="v money">${prox90.length}</div><div class="s">${partos.length} prenha(s) ou inseminada(s)</div></div>

function descEvento(e){

  if(e.tipo==='ia'||e.tipo==='cobertura') return `${p?'· '+esc(p):''}${e.inseminador?` · por ${esc(e.inseminador)}`:''}${e.obs?` · ${esc(e.obs)}`:''}`;
  if(e.tipo==='diagnostico') return `· <span class="tag ${e.resultado==='prenha'?'t-ok':'t-bad'}">${e.resultado==='prenha'?'Prenha':'Vazia'}</span>${e.metodo?' · '+esc(e.metodo):''}${e.previsao?' · parto previsto '+br(e.previsao):''}${e.obs?` · ${esc(e.obs)}`:''}`;

}
async function carregarFotosAnimal(){
  for(const img of document.querySelectorAll('img[data-foto]')){

    try{ const s=await db.collection('fotos').doc(id).get(); if(s.exists) img.src=s.data().img; }catch(e){}

}

function apagarAnimal(id){

  confirmar('Apagar '+esc(a.nome||a.brinco)+'?','O cadastro sai do sistema. Para animais vendidos ou mortos, prefira mudar a situação.','Apagar',async()=>{ apagarAnexosDe(a.anexos); await apagarDoc('animais',id); toast('Animal apagado'); if(pag==='animal') pag='rebanho'; });

function datalistSemen(){ const nomes=[...new Set([...cad.semens.map(s=>s.nome), ...eventos.map(e=>e.paiNome).filter(Boolean), ...animais.map(a=>a.paiNome).filter(Boolean)])].sort(); return `<datalist id="sugSemen">${nomes.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`; }

  <div class="panel"><div class="panel-h"><div><h2>Vão parir</h2><p class="sub">Prenhas e inseminadas, da previsão mais próxima para a mais distante.</p></div></div>
    ${partos.length?`<div class="tw"><table><thead><tr><th>Previsão</th><th>Vaca</th><th>Pai (touro / sêmen)</th><th class="hide-m">Serviço</th><th class="hide-m">Secar em</th><th>Situação</th></tr></thead><tbody>
    ${partos.map(x=>`<tr><td><b>${br(x.s.previsao)}</b><div class="muted" style="font-size:12px">${difDias(x.s.previsao,h)>=0?'faltam '+difDias(x.s.previsao,h)+' dias':'passou '+(-difDias(x.s.previsao,h))+' dias'}</div></td><td>${linkAnimal(x.a.id)}</td><td>${esc(x.s.pai||'—')}</td><td class="hide-m">${x.s.tipoServ==='ia'?'<span class="tag t-acc">IA</span>':'<span class="tag t-mut">monta</span>'} ${br(x.s.ultServ.data)}</td><td class="hide-m">${x.a.categoria==='lactacao'?br(x.s.secar):'<span class="muted">já seca</span>'}</td><td><span class="tag ${STATUS_TAG[x.s.status]}">${x.s.status==='prenha'?'Prenha':'Sem diagnóstico'}</span></td></tr>`).join('')}
    </tbody></table></div>`:`<div class="vazio">Nenhuma vaca prenha ou inseminada lançada.<br><button class="btn" onclick="formServico()">Lançar inseminação</button></div>`}
  </div>
  <div class="grid2">
    <div class="panel"><h2>Para secar</h2><p class="sub">Vacas em lactação com parto previsto.</p>
      ${secar.length?`<div class="tw"><table><tbody>${secar.map(x=>`<tr><td>${linkAnimal(x.a.id)}</td><td class="n ${x.s.secar<=h?'neg':''}">${br(x.s.secar)}</td><td class="act"><button class="btn sm sec" onclick="formSecagem('${x.a.id}')">Secou</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="vazio">Nenhuma.</div>'}
    </div>

    ${vazias.length?`<div class="tw"><table><tbody>${vazias.map(x=>`<tr><td>${linkAnimal(x.a.id)}</td><td><span class="tag ${STATUS_TAG[x.s.status]}">${STATUS_TXT[x.s.status]}</span>${x.s.ultParto?`<div class="muted" style="font-size:12px">pariu há ${difDias(h,x.s.ultParto.data)} dias</div>`:''}</td><td class="act"><button class="btn sm sec" onclick="formServico(null,'${x.a.id}')">Inseminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="vazio">Nenhuma.</div>'}

function lerFolhaDoForm(){ const f=$('mform'); FOLHA.litros=f.litros.value; FOLHA.preco=f.preco.value; FOLHA.bruto=f.bruto.value; FOLHA.dataRecebimento=f.receb.value; FOLHA.obs=f.obs.value.trim(); }
function previaFolha(){

  FOLHA.parceiros.forEach((x,i)=>{ const c=$('fpv'+i); if(c) c.textContent=brl(num(x.litros)*num(x.preco)); });

}

function pdfBase(titulo){
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:'mm',format:'a4'}), PW=210, ML=18, MR=192;
  doc.setFillColor(28,58,38); doc.rect(0,0,PW,26,'F'); doc.setTextColor(255,255,255);
  doc.setFont('times','bold'); doc.setFontSize(18); doc.text('Roça',ML,15); doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text('Leite e rebanho',ML,20.5);
  doc.setFontSize(10); doc.text(tira(titulo),MR,15,{align:'right'});
  return {doc, ML, MR, PW};
}
const tira = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'');
const realPdf = v => 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function pdfParceiro(pid){
  if(!window.jspdf){ toast('O gerador de PDF ainda não carregou. Tente de novo.',true); return; }
  const f=calcFolha(V.mes), x=f&&f.parceiros.find(p=>p.parceiroId===pid); if(!x) return;
  const {doc,ML,MR,PW}=pdfBase('Leite de '+mesNome(V.mes)); let y=40; const nome=parc(pid).nome;
  doc.setTextColor(23,36,47); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(tira(nome),ML,y); y+=12;
  const ln=(a,b,bold)=>{ doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(bold?12:10); doc.setTextColor(40,50,60); doc.text(tira(a),ML,y); doc.text(tira(b),MR,y,{align:'right'}); doc.setDrawColor(226,231,235); doc.line(ML,y+2,MR,y+2); y+=8; };
  ln('Mes do leite',mesNome(V.mes)); ln('Litros entregues',inteiro(x.litros)+' L'); ln('Preco por litro',realPdf(x.preco)); ln('Data do pagamento',br(x.dataPagamento||f.dataRecebimento));
  y+=2; doc.setFillColor(229,240,232); doc.rect(ML,y-5,MR-ML,11,'F'); ln('Valor a receber',realPdf(x.valor),true);
  y+=24; doc.setDrawColor(23,36,47); doc.line(ML,y,ML+70,y); doc.line(MR-70,y,MR,y); doc.setFontSize(8.5); doc.setTextColor(100,110,120); doc.text('Pagador',ML,y+5); doc.text(tira(nome),MR-70,y+5); doc.text('Emitido em '+br(hoje()),PW/2,y+14,{align:'center'});
  doc.save('leite_'+tira(nome).toLowerCase().replace(/\s+/g,'_')+'_'+V.mes+'.pdf'); toast('PDF baixado');
}
function pdfFolha(){
  if(!window.jspdf){ toast('O gerador de PDF ainda não carregou. Tente de novo.',true); return; }
  const f=calcFolha(V.mes); if(!f) return;
  const {doc,ML,MR}=pdfBase('Folha do leite · '+mesNome(V.mes)); let y=40;
  const ln=(a,b,neg,bold)=>{ doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(bold?12:10); doc.setTextColor(40,50,60); doc.text(tira(a),ML,y); doc.setTextColor(neg?178:23,neg?58:36,neg?72:47); doc.text((neg?'- ':'')+realPdf(b),MR,y,{align:'right'}); doc.setDrawColor(226,231,235); doc.line(ML,y+2,MR,y+2); y+=7.5; };
  doc.setTextColor(100,110,120); doc.setFontSize(9); doc.text(tira(`${inteiro(f.litros)} L no mes${f.precoMedio?' · '+realPdf(f.precoMedio)+'/L':''}${f.dataRecebimento?' · recebido em '+br(f.dataRecebimento):''}`),ML,y); y+=9;
  ln('Valor bruto',f.bruto); f.descontos.forEach(d=>ln(d.desc||'Desconto',d.valor,true)); ln('Recebido do laticinio',f.recebido,false,true);
  f.parceiros.forEach(x=>ln(`Repasse ${parc(x.parceiroId).nome} (${inteiro(x.litros)} L x ${realPdf(x.preco)})`,x.valor,true));
  y+=2; doc.setFillColor(229,240,232); doc.rect(ML,y-5,MR-ML,11,'F'); ln('Liquido',f.liquidoPai,false,true);
  doc.save('folha_leite_'+V.mes+'.pdf'); toast('PDF baixado');
}

/* ============================ FLUXO DE CAIXA ============================
   Saldo inicial do mês + entradas − saídas, em ordem de data,
   com o saldo dia a dia para ver quando o dinheiro fica curto.
   ======================================================================= */
/* Lançamentos automáticos do caixa (calculados, não ficam gravados):
   - recebimento do leite (bruto − descontos da folha) na data de recebimento
   - repasse de cada parceiro na data de pagamento
   - adiantamentos recebidos do laticínio
   - remédios com valor, na data da compra */
function caixaAuto(ym, incluirOcultos){
  const ocultos=cad.caixa.ocultos||{};
  // ajustes feitos direto no caixa: mudam só o valor/dia no fluxo, não o holerite
  const aj=cad.caixa.ajustes||{};
  const todos=caixaAutoTodos(ym).map(l=>{ const a=aj[l.id]; if(!a) return l;
    return {...l, valorHolerite:l.valor, dataOriginal:l.data, valor:a.valor!=null?num(a.valor):l.valor, data:a.data&&noMes(a.data,ym)?a.data:l.data, ajustado:true, obsAjuste:a.obs||''}; });
  return incluirOcultos?todos:todos.filter(l=>!ocultos[l.id]);
}
const refTxt = ref => `${MESES[+ref.slice(5)-1].slice(0,3)}/${ref.slice(2,4)}`;
function caixaAutoTodos(ym){
  const pagos=cad.caixa.pagosAuto||{}, out=[];
  const p=(key, def)=>pagos[key]!==undefined?!!pagos[key]:def;
  Object.keys(cad.folhas).forEach(ref=>{ const f=calcFolha(ref); if(!f) return;
    if(f.dataRecebimento&&noMes(f.dataRecebimento,ym)&&f.recebido>0){ const key='lei:'+ref;
      out.push({id:key, auto:'leite', ref, tipo:'entrada', data:f.dataRecebimento, desc:`Leite ${refTxt(ref)} (folha: bruto − descontos)`, valor:f.recebido, pago:p(key,f.dataRecebimento<=hoje())}); }
    f.parceiros.forEach(x=>{ const d=x.dataPagamento||f.dataRecebimento; if(!d||!noMes(d,ym)||!(x.valor>0)) return; const key='rep:'+ref+':'+x.parceiroId;
      out.push({id:key, auto:'repasse', ref, parceiroId:x.parceiroId, tipo:'saida', data:d, desc:`Repasse ${parc(x.parceiroId).nome} (${refTxt(ref)} · ${inteiro(x.litros)} L)`, valor:x.valor, pago:p(key,false)}); });
    f.descontos.forEach(dd=>{ if(!dd.recebidoEm||!noMes(dd.recebidoEm,ym)||!(num(dd.valor)>0)) return; const key='adi:'+ref+':'+dd.id;
      out.push({id:key, auto:'adiantamento', ref, tipo:'entrada', data:dd.recebidoEm, desc:`${dd.desc||'Adiantamento'} (desconta na folha de ${refTxt(ref)})`, valor:num(dd.valor), pago:p(key,dd.recebidoEm<=hoje())}); });
  });
  tratamentos.filter(t=>t.caixa!==false&&num(t.valor)>0&&noMes(t.data,ym)).forEach(t=>{ const key='rem:'+t.id;
    out.push({id:key, auto:'remedio', tratId:t.id, criado:tempo(t), tipo:'saida', data:t.data, desc:`Remédio: ${t.produto}${t.vacas&&t.vacas.length?' ('+t.vacas.map(id=>nomeAnimal(id)).join(', ')+')':''}`, valor:num(t.valor), pago:p(key,t.data<=hoje())}); });
  return out;
}
function caixaMes(ym){
  const C=cad.caixa, ini=C.saldos[ym];
  const ls=[...C.lancs.filter(l=>noMes(l.data,ym)), ...caixaAuto(ym)].sort((a,b)=>a.data.localeCompare(b.data)||tempo(a)-tempo(b));
  let saldo=num(ini), menor=null;
  const linhas=ls.map(l=>{ saldo=r2(saldo+(l.tipo==='entrada'?1:-1)*num(l.valor)); if(menor===null||saldo<menor.saldo) menor={saldo,data:l.data}; return {...l, saldo}; });
  const ent=r2(soma(ls.filter(l=>l.tipo==='entrada'),l=>l.valor)), sai=r2(soma(ls.filter(l=>l.tipo!=='entrada'),l=>l.valor));
  const aPagar=r2(soma(ls.filter(l=>l.tipo!=='entrada'&&!l.pago),l=>l.valor));
  return {temInicio:ini!==undefined&&ini!==null&&ini!=='', inicio:num(ini), linhas, ent, sai, aPagar, fim:r2(num(ini)+ent-sai), menor};
}

function comprimir(file){
  return new Promise((ok,erro)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.naturalWidth, h=img.naturalHeight; const max=1600; if(Math.max(w,h)>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      let q=0.72, out=c.toDataURL('image/jpeg',q); while(out.length>850000 && q>0.3){ q-=0.1; out=c.toDataURL('image/jpeg',q); }
      ok(out);
    };
    img.onerror=erro; img.src=url;
  });
}

/* ============================ ANEXOS ============================
   Qualquer arquivo (PDF, foto, planilha…) até 8 MB. Fica no Firestore,
   dividido em partes de ~900 KB (anexos/{id} + anexos_partes/{id}_{n}).
   Fotos são comprimidas antes de enviar.
   ================================================================ */
const ANEXO_MAX=8*1024*1024, PARTE=900000;
let ANX=null;
function campoAnexos(lista){
  ANX={lista:JSON.parse(JSON.stringify(lista||[])), novos:[], removidos:[], lendo:0};
  return `<div class="field"><span style="display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px">Documentos anexados (opcional)</span>
    <div id="anxLista"></div>
    <label class="btn sm sec" style="margin-top:6px">${I.clip}Anexar documento<input type="file" multiple style="display:none" onchange="lerAnexos(this)"></label>
    <div class="ajuda">PDF, foto, planilha… até 8 MB cada.</div></div>`;
}
function desenharAnexos(){
  const el=$('anxLista'); if(!el||!ANX) return;
  const itens=[...ANX.lista.map((a,i)=>({...a, k:'l'+i})), ...ANX.novos.map((a,i)=>({...a, k:'n'+i, novo:true}))];
  el.innerHTML=itens.length?itens.map(a=>`<div class="anx">${I.clip}<span class="nm">${esc(a.nome)}</span><span class="muted">${tamanho(a.tam)}${a.novo?' · novo':''}</span>
    ${a.novo?'':`<button type="button" class="link" onclick="abrirAnexo('${a.id}')">Abrir</button>`}
    <button type="button" class="icon-btn" title="Remover" onclick="tirarAnexo('${a.k}')">${I.x}</button></div>`).join(''):(ANX.lendo?'':'<div class="muted" style="font-size:13px">Nenhum documento.</div>');
  if(ANX.lendo) el.innerHTML+=`<div class="ajuda">Preparando ${ANX.lendo} arquivo(s)…</div>`;
}
function tirarAnexo(k){ const i=+k.slice(1); if(k[0]==='n') ANX.novos.splice(i,1); else ANX.removidos.push(...ANX.lista.splice(i,1)); desenharAnexos(); }
const tamanho = b => b>=1048576 ? (b/1048576).toFixed(1).replace('.',',')+' MB' : Math.max(1,Math.round(b/1024))+' KB';
function lerArquivo(f){ return new Promise((ok,erro)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=erro; r.readAsDataURL(f); }); }
async function lerAnexos(inp){
  const fs=[...(inp.files||[])]; inp.value='';
  for(const f of fs){
    if(f.size>ANEXO_MAX){ toast(`"${f.name}" passa de 8 MB.`,true); continue; }
    ANX.lendo++; desenharAnexos();
    try{
      let data, tipo=f.type||'application/octet-stream', nome=f.name;
      if(/^image\/(jpeg|png|webp|heic|heif)/.test(tipo)){ try{ data=await comprimir(f); tipo='image/jpeg'; nome=nome.replace(/\.(png|webp|heic|heif)$/i,'.jpg'); }catch(e){ data=await lerArquivo(f); } }
      else data=await lerArquivo(f);
      ANX.novos.push({nome, tipo, tam:Math.round((data.length-data.indexOf(',')-1)*0.75), data});
    }catch(e){ console.error(e); toast(`Não foi possível ler "${f.name}".`,true); }
    ANX.lendo--; desenharAnexos();
  }
}
/* Grava os novos, apaga os removidos e devolve a lista final para guardar no registro. */
async function salvarAnexos(ref){
  if(!ANX) return [];
  if(ANX.lendo){ toast('Aguarde os documentos terminarem de carregar.',true); throw new Error('lendo'); }
  const final=[...ANX.lista];
  for(const a of ANX.novos){
    const id=uid(), partes=Math.ceil(a.data.length/PARTE);
    for(let i=0;i<partes;i++){ const d=a.data.slice(i*PARTE,(i+1)*PARTE); acompanhar(()=>db.collection('anexos_partes').doc(id+'_'+i).set({d})); }
    acompanhar(()=>db.collection('anexos').doc(id).set({nome:a.nome, tipo:a.tipo, tam:a.tam, partes, ref:ref||'', criado:Date.now()}));
    final.push({id, nome:a.nome, tipo:a.tipo, tam:a.tam});
  }
  ANX.novos=[];
  for(const a of ANX.removidos) await apagarAnexoDocs(a.id);
  ANX.removidos=[];
  return final;
}
async function apagarAnexoDocs(id){
  let s=null; try{ s=await db.collection('anexos').doc(id).get(); }catch(e){}
  const n=s&&s.exists ? (s.data().partes||1) : Math.ceil(ANEXO_MAX/PARTE);  // sem sinal: apaga todas as partes possíveis
  for(let i=0;i<n;i++) acompanhar(()=>db.collection('anexos_partes').doc(id+'_'+i).delete());
  acompanhar(()=>db.collection('anexos').doc(id).delete());
}
function apagarAnexosDe(lista){ (lista||[]).forEach(a=>apagarAnexoDocs(a.id)); }
async function abrirAnexo(id){
  const janela=window.open('','_blank');
  toast('Abrindo documento…');
  try{
    const s=await db.collection('anexos').doc(id).get(); if(!s.exists){ if(janela) janela.close(); toast('Documento não encontrado.',true); return; }
    const a=s.data(); let data='';
    for(let i=0;i<(a.partes||1);i++){ const p=await db.collection('anexos_partes').doc(id+'_'+i).get(); data+=p.exists?p.data().d:''; }
    const blob=await (await fetch(data)).blob(), url=URL.createObjectURL(blob);
    if(janela && /^(image\/|application\/pdf)/.test(a.tipo)){ janela.location.href=url; }
    else { if(janela) janela.close(); const el=document.createElement('a'); el.href=url; el.download=a.nome; document.body.appendChild(el); el.click(); el.remove(); }
    window.__ultimoAnexo={nome:a.nome, tipo:a.tipo, bytes:blob.size};
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }catch(e){ console.error(e); if(janela) janela.close(); toast(online()?'Não foi possível abrir o documento.':'Sem internet: esse documento abre quando o sinal voltar.',true); }
}
function verAnexos(lista){
  abrirModal({titulo:'Documentos anexados', ok:'', cancelar:'Fechar',
    corpo:(lista||[]).map(a=>`<div class="anx">${I.clip}<span class="nm">${esc(a.nome)}</span><span class="muted">${tamanho(a.tam)}</span><button type="button" class="btn sm sec" onclick="abrirAnexo('${a.id}')">Abrir</button></div>`).join('')});
}
const clipBtn = lista => (lista&&lista.length) ? `<button class="icon-btn" title="${lista.length} documento(s)" onclick="event.stopPropagation();verAnexos(${esc(JSON.stringify(lista))})">${I.clip}${lista.length>1?`<small>${lista.length}</small>`:''}</button>` : '';


/* ============================ LOGIN ============================ */
function msgLogin(t,tipo){ const m=$('lgMsg'); m.textContent=t; m.className='msg '+(tipo||''); }
async function entrar(){
  const e=$('lgEmail').value.trim().toLowerCase(), s=$('lgSenha').value; $('lgBtn').disabled=true; msgLogin('');
  try{ await auth.signInWithEmailAndPassword(e,s); }
  catch(err){ const c=err.code||''; msgLogin(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?'E-mail ou senha incorretos.':c==='auth/too-many-requests'?'Muitas tentativas. Aguarde alguns minutos.':c==='auth/network-request-failed'?'Sem conexão com a internet.':'Não foi possível entrar.','err'); }
  $('lgBtn').disabled=false;
}
async function esqueciSenha(){
  const e=$('lgEmail').value.trim().toLowerCase(); if(!e){ msgLogin('Digite seu e-mail no campo acima e clique de novo.','err'); $('lgEmail').focus(); return; }
  try{ await auth.sendPasswordResetEmail(e); msgLogin('Se esse e-mail tiver acesso, enviamos um link para '+e+'. Veja também a caixa de spam.','ok'); }
  catch(err){ msgLogin('Não foi possível enviar o e-mail para esse endereço.','err'); }
}
function sair(){
  fecharMais();
  if(aguardando||fila||pendente){ confirmar('Sair agora?','Ainda tem lançamento guardado no celular esperando sinal para ir para a nuvem. Se sair agora, ele pode se perder. Espere o sinal voltar antes de sair.','Sair mesmo assim',()=>{ MODAL=null; sairJa(); }); return; }
  sairJa();
}
function sairJa(){ unsubs.forEach(u=>u()); unsubs=[]; try{ localStorage.removeItem(PEND_LOCAL); }catch(e){} auth.signOut().then(()=>location.reload()); }

if('serviceWorker' in navigator && /^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e));
(function iniciar(){
  if(typeof firebase==='undefined'){ document.body.innerHTML='<p style="padding:32px;font-family:sans-serif">Não foi possível carregar o sistema. Verifique a internet e recarregue a página.</p>'; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth(); db=firebase.firestore();
  /* guarda os dados e os lançamentos no celular (precisa vir antes de qualquer leitura) */
  try{ db.enablePersistence({synchronizeTabs:true}).then(()=>persistente=true).catch(e=>console.warn('sem cache offline',e&&e.code)); }catch(e){ console.warn(e); }
  cadRef=db.collection('dados').doc('geral');
  const h=(location.hash||'').slice(1); if(PAGS.some(p=>p.id===h)) pag=h;
  auth.onAuthStateChanged(u=>{
    if(u){ $('login').style.display='none'; $('app').style.display='block'; $('contaEmail').textContent=u.email; escutar(); atualizarRede(); if(aguardando) marcarAguardando(); }
    else { $('app').style.display='none'; $('login').style.display='grid'; }
  });
  window.addEventListener('beforeunload',e=>{ enviarCad(); if(!persistente && (fila>0)){ e.preventDefault(); e.returnValue=''; } });
})();
